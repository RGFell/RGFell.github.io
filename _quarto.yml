project:
  type: website
  output-dir: _site
  render:              # only .qmd files, so CLAUDE.md is never published
    - "*.qmd"
    - "news/*.qmd"
  pre-render: _scripts/build_publications.py   # publications.bib -> publication lists
  post-render: _scripts/publish_cv_pdf.py      # cv.qmd (Typst) -> files/CV_Rodrigo_Gomez_Fell.pdf
  resources:
    - images/profile.webp   # WebP files are referenced only from raw HTML <picture> elements
    - images/projects/*.webp
    - images/sar-mean-std.webp   # referenced only from the Home <picture> element
    - images/cc-by-88x31.png   # referenced only from the footer HTML

website:
  title: "Rodrigo Gomez-Fell"
  description: "Rodrigo Gomez-Fell is a postdoctoral fellow at Gateway Antarctica, University of Canterbury, who uses satellite radar to study Antarctic ice."
  site-url: "https://rgfell.github.io"   # enables sitemap.xml and absolute Open Graph URLs
  repo-url: "https://github.com/RGFell/RGFell.github.io"
  favicon: images/favicon.svg
  image: images/social-card.jpg            # default Open Graph / Twitter image (1200 x 630)
  image-alt: "Rodrigo Gomez-Fell, Antarctic glaciology and SAR remote sensing, Gateway Antarctica, University of Canterbury: portrait over a photo of a sunlit Antarctic glacier front."
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  page-navigation: false
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    title: "Rodrigo Gomez-Fell"
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: cv.qmd
        text: CV
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: teaching.qmd
        text: Teaching
      - text: Publications
        menu:
          - href: publications.qmd
            text: Publications
          - href: reports.qmd
            text: Reports
      # Stage 3:
      # - href: news.qmd
      #   text: News
      - href: contact.qmd
        text: Contact
  page-footer:
    left: "© 2026 Rodrigo Gomez-Fell"
    center: >-
      <a class="footer-icon" href="https://orcid.org/0000-0002-0391-1323" aria-label="ORCID profile" title="ORCID"><svg class="orcid-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="12" fill="currentColor"/><text x="12" y="16.2" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="var(--bs-body-bg, #fff)">iD</text></svg></a>
      <a class="footer-icon" href="https://scholar.google.com/citations?user=zdY64_kAAAAJ&amp;hl=en" aria-label="Google Scholar profile" title="Google Scholar"><i class="bi bi-mortarboard-fill" aria-hidden="true"></i></a>
      <a class="footer-icon" href="https://www.linkedin.com/in/rodrigogomezfell/" aria-label="LinkedIn profile" title="LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a>
      <a class="footer-icon" href="https://github.com/RGFell" aria-label="GitHub profile" title="GitHub"><i class="bi bi-github" aria-hidden="true"></i></a>
      <p class="site-licence"><a rel="license" href="https://creativecommons.org/licenses/by/4.0/" class="cc-badge"><img src="/images/cc-by-88x31.png" width="88" height="31" alt="Creative Commons Attribution 4.0 International License"></a>
      Text and original photographs on this site are © Rodrigo Gomez-Fell and licensed under <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> unless stated otherwise.
      The BIOMASS project image is © ESA, used under the <a href="https://www.esa.int/ESA_Multimedia/Terms_and_conditions_of_use_of_images_and_videos_available_on_the_esa_website">ESA Standard Licence</a>.
      Images derived from third-party satellite data (Copernicus Sentinel, UMBRA) remain subject to their providers' terms, credited where they appear.
      My publications remain copyright of their respective journals; where a paper isn't open access, only the citation and DOI are given.</p>
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    respect-user-color-scheme: true   # follow the visitor's OS setting; navbar toggle overrides
    css: styles.css
    toc: false
    lang: en
    smooth-scroll: true
